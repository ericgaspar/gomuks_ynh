#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "gomuks"
name = "Gomuks"
description.en = "Explain in *a few (10~15) words* the purpose of the app or what it actually does (it is meant to give a rough idea to users browsing a catalog of 100+ apps)"
description.fr = "Expliquez en *quelques* (10~15) mots l'utilité de l'app ou ce qu'elle fait (l'objectif est de donner une idée grossière pour des utilisateurs qui naviguent dans un catalogue de 100+ apps)"

version = "26.05~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "free"
website = "https://gomuks.app/"
demo = "https://demo.example.com"
admindoc = "https://docs.mau.fi/gomuks/"
code = "https://github.com/gomuks/gomuks"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/example"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    extract = false
    rename = "gomuks"
    amd64.url = "https://github.com/gomuks/gomuks/releases/download/v0.2605.0/gomuks-amd64"
    amd64.sha256 = "cb7ad4e0273411b9cb2e13d9e1ec4146615fc3287ed5a96cd1fcc8e0707f23ca"
    arm64.url = "https://github.com/gomuks/gomuks/releases/download/v0.2605.0/gomuks-arm64"
    arm64.sha256 = ""
    armhf.url = "https://github.com/gomuks/gomuks/releases/download/v0.2605.0/gomuks-arm"
    armhf.sha256 = ""

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^gomuks-amd64$"
    autoupdate.asset.arm64 = "^gomuks-arm64$"
    autoupdate.asset.armhf = "^gomuks-arm$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.port = 29325
